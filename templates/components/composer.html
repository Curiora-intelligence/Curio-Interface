<div class="composer-dock">
  <div class="mode-tabs" role="group" aria-label="Context mode">{% for mode in ['Personal', 'Food', 'Shopping', 'Research', 'Career'] %}<button type="button" data-mode="{{ mode }}" aria-pressed="{{ 'true' if mode == 'Personal' else 'false' }}" class="{{ 'selected' if mode == 'Personal' else '' }}">{{ mode }}</button>{% endfor %}</div>
  <button class="interview-toggle text-button" id="interview-toggle" hidden>Practice a mock interview ↗</button>
  <form class="composer" id="chat-form"><label class="sr-only" for="message">Your message</label><textarea id="message" rows="2" maxlength="16000" placeholder="What’s on your mind?"></textarea><div id="attachment" class="attachment" hidden><span></span><button type="button" id="remove-image" aria-label="Remove image">×</button></div><div class="composer-actions"><div><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button type="button" class="icon-button" id="attach-image" aria-label="Attach an image">＋</button><button type="button" class="icon-button" id="microphone" aria-label="Dictate a message" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><span class="divider"></span><button type="button" class="live-button" id="open-live">◉ Curio Live</button></div><button type="submit" class="send-button" id="send" aria-label="Send message">↑</button></div></form>
  <button type="button" id="voice-toggle" class="text-button voice-toggle" aria-pressed="false">Voice replies OFF</button>
  <p class="composer-note" id="composer-note">A conversation that can carry forward. By Curiora.</p>
</div>
